<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1418">
<title>TRU FORD</title>
<style>
:root{--bg:#0e1418;--ink:#e7f1f4;--dim:#9eb4bc;--line:#24343c;--water:#7ec8d4;--card:#162026;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--water)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0a1014;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--water);color:#0e1418;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--water);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>FORD</span></h1><p class="sub">Where to cross. The upstream pole. A 45-degree course. FM 21-76. Not a raft.</p></header>
<div class="warn">If you cannot stand, you do not cross. A log, a rope bridge, and a float are not packed. Boots stay on. A boot in the current is a foot you can still feel.</div>
<div class="bar"><input id="q" placeholder="site, pole, angle…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Look first",d:"Find a high place, or climb a tree, before you pick a line. You cannot judge a channel from the bank you are standing on."},
{t:"Where",d:"A level stretch where the river breaks into several channels. Two or three narrow channels are usually easier than one wide river. A shallow bank or a sandbar. Pick a point upstream of that bar, so if you lose your footing the current carries you onto it, not past it."},
{t:"The course",d:"Cross so you meet the current at about a 45-degree angle, heading downstream. Straight across fights the whole river. The angle lets the water take some of the walk."},
{t:"The pole",d:"A strong pole about 7.5 centimeters across and 2.1 to 2.4 meters long. Plant it on your upstream side so it breaks the current. Step, then move the pole a little downstream of where it was, still upstream of you. The next foot goes below the pole. Keep it slanted so the current holds it against your shoulder. The weight of a pack helps you stand. It does not help you swim."},
{t:"More than one",d:"Cross together on one pole. The heaviest person is on the downstream end. The lightest is on the upstream end. The river hits the light person first and the heavy person holds the line."},
{t:"Gap",d:"No raft, no poncho float, no rope bridge, no swimming stroke. Those are in the manual and not in this ship. If the pole will not hold you, the answer is the bank you are already on. Shelter is the other side of stopping."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">FORD</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">FM 21-76 expedient crossings: channels, sandbar, 45 degrees, pole 7.5 cm by 2.1 to 2.4 m, heaviest downstream. No raft.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented raft.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
